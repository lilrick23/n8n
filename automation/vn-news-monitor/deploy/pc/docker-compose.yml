# vn-news-monitor tren may tinh ca nhan (Windows hoac macOS, Docker Desktop).
# Chay trong thu muc nay: docker compose up -d
# Lan dau, dich vu "cai-dat" nhap workflow va credential, roi dung. Sau do n8n chay lien tuc.
services:
  cai-dat:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.45.0}
    entrypoint: ["node", "/setup/init.mjs"]
    env_file:
      - path: ./khoa.txt
        required: false
    environment:
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - n8n_data:/home/node/.n8n
      - ./:/setup
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.45.0}
    restart: unless-stopped
    depends_on:
      cai-dat:
        condition: service_completed_successfully
    # Chi mo tren may nay: http://localhost:5678
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      - TZ=Asia/Ho_Chi_Minh
      - N8N_LISTEN_ADDRESS=0.0.0.0
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=10000
    volumes:
      - n8n_data:/home/node/.n8n
volumes:
  n8n_data:
