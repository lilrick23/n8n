# n8n cho vn-news-monitor tren may chu luon bat (VPS hoac may ca nhan).
# Cong 5678 chi mo tren 127.0.0.1: vao giao dien qua duong ham SSH, khong mo ra Internet.
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.45.0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      - TZ=Asia/Ho_Chi_Minh
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}
      # Lang nghe IPv4 trong container; cong ngoai van chi mo tren 127.0.0.1.
      - N8N_LISTEN_ADDRESS=0.0.0.0
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      # Giu lich su chay 14 ngay (336 gio), toi da 10.000 lan.
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=10000
    volumes:
      - n8n_data:/home/node/.n8n
      - ./import:/import:ro
volumes:
  n8n_data:
